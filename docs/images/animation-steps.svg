      <rect x="18" y="232" width="42" height="23" rx="11" fill="#e5f3cf"/>
      <text x="39" y="248" text-anchor="middle" fill="#4a7837" font-size="12" font-weight="700">+2</text>
    </g>
    <g transform="translate(834 92)">
      <rect width="232" height="270" rx="13" fill="#ffffff"/>
      <text x="18" y="31" fill="#6e9b3e" font-size="12" font-weight="700" letter-spacing="1">PDF 04</text>
      <rect x="18" y="52" width="152" height="16" rx="8" fill="#14223a"/>
