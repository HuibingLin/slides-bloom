      <rect x="48" y="194" width="158" height="10" rx="5" fill="#203550"/>
      <rect x="18" y="232" width="42" height="23" rx="11" fill="#e5f3cf"/>
      <text x="39" y="248" text-anchor="middle" fill="#4a7837" font-size="12" font-weight="700">+3</text>
